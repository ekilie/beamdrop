name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: static/frontend
        run: bun install

      - name: Build frontend
        working-directory: static/frontend
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: static/frontend/dist

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: darwin
            arch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            os: darwin
            arch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: amd64
            os: linux
            arch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            os: linux
            arch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            os: windows
            arch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            os: windows
            arch: arm64
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: static/frontend/dist

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          MODULE="github.com/tachRoutine/beamdrop-go"
          LDFLAGS="-s -w -X '${MODULE}/config.VERSION=${VERSION}' -X '${MODULE}/config.Commit=${COMMIT}' -X '${MODULE}/config.BuildDate=${BUILD_DATE}'"
          go build -ldflags "${LDFLAGS}" -o beamdrop${{ matrix.ext }} ./cmd/beam

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar czf beamdrop-${{ matrix.os }}-${{ matrix.arch }}.tar.gz beamdrop${{ matrix.ext }}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: zip beamdrop-${{ matrix.os }}-${{ matrix.arch }}.zip beamdrop${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: beamdrop-${{ matrix.os }}-${{ matrix.arch }}
          path: beamdrop-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
